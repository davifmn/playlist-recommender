[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist-recommender"
version = "2.0.0"
description = "Playlist recommendations from association rules: batch trainer + API on Kubernetes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Davi Fraga" }]
requires-python = ">=3.12"
# The core (model format, storage) is tiny; each service pulls only what it needs, which
# keeps the API image free of pandas/mlxtend/scikit-learn.
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.32", "prometheus-client>=0.21"]
trainer = ["pandas>=2.2", "mlxtend>=0.23"]
dev = [
    "playlist-recommender[api,trainer]",
    "httpx2",
    "moto[s3]>=5",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
recommender-api = "recommender.api.app:main"
recommender-train = "recommender.trainer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S"]
