apiVersion: v1
kind: Service
metadata:
  name: {{ include "recommender.fullname" . }}-api
  labels: {{- include "recommender.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector: {{- include "recommender.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
