{{- if .Values.trainer.runOnDeploy }}
# Trains a model right after each deploy, so a fresh environment becomes ready without
# waiting for the nightly CronJob. Helm: a new Job per release revision (Jobs are
# immutable). Argo CD: a Sync hook, recreated on every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "recommender.fullname" . }}-train-r{{ .Release.Revision }}
  labels: {{- include "recommender.labels" . | nindent 4 }}
    app.kubernetes.io/component: trainer
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: {{ .Values.trainer.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {{- include "recommender.selector" . | nindent 8 }}
        app.kubernetes.io/component: trainer
    spec: {{- include "recommender.trainerPod" . | nindent 6 }}
{{- end }}
