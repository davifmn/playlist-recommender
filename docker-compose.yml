# Whole stack on a laptop: S3 emulator -> trainer (seeds demo data, trains) -> API.
#   docker compose up --build      then: python scripts/smoke_test.py http://localhost:8080
x-storage: &storage
  RECSYS_STORE: s3
  RECSYS_BUCKET: recommender-local
  RECSYS_S3_ENDPOINT_URL: http://s3:5000
  AWS_ACCESS_KEY_ID: emulator
  AWS_SECRET_ACCESS_KEY: emulator
  AWS_DEFAULT_REGION: us-east-1

services:
  s3:
    image: motoserver/moto:5.2.5
    ports: ["5000:5000"]

  seed:
    build: { context: ., dockerfile: services/trainer/Dockerfile }
    command: ["seed-demo", "--create-bucket"]
    environment: *storage
    depends_on: [s3]

  trainer:
    build: { context: ., dockerfile: services/trainer/Dockerfile }
    command: ["run"]
    environment: *storage
    depends_on:
      seed: { condition: service_completed_successfully }

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment:
      <<: *storage
      RECSYS_POLL_SECONDS: "5"
    ports: ["8080:8080"]
    depends_on: [s3]
